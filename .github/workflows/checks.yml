name: Prototype checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.event_name != 'push' || github.event.head_commit.message != 'Upload prepared source packages'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 ref verified 2026-10-24
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 ref verified 2026-10-24
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 ref verified 2026-10-24
        with:
          python-version-file: .python-version
      - name: Install test dependency
        run: python -m pip install -r server/requirements.txt
      - name: Rebuild and verify
        run: python scripts/verify.py
      - name: Require current generated pages
        run: git diff --exit-code -- play/
