name: Native Godot checks
on:
  pull_request:
  push:
    branches: [main, 'codex/garage-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - name: Install pinned Godot 4.6.3 standard
        run: |
          curl --fail --location --retry 3 --output /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          echo 'd0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3  /tmp/godot.zip' | sha256sum --check
          unzip -q /tmp/godot.zip -d /tmp/garage-godot
          echo 'GODOT_BIN=/tmp/garage-godot/Godot_v4.6.3-stable_linux.x86_64' >> "$GITHUB_ENV"
      - name: Native deterministic checks and scene boot
        run: python scripts/verify_native.py
      - name: Independent native server and clients under latency and loss
        run: |
          python scripts/test_multiplayer.py --matrix --output "$RUNNER_TEMP/garage-multiplayer-matrix"
          python scripts/test_multiplayer.py --repeat --output "$RUNNER_TEMP/garage-multiplayer-repeat"
          python scripts/test_multiplayer.py --auth --output "$RUNNER_TEMP/garage-multiplayer-auth"
      - name: Device-tool safety regression
        run: python tests/test_device_tools.py
      - name: iOS source preflight and inspector fixtures
        run: |
          python scripts/ios_preflight.py
          python scripts/ios_preflight.py --self-test
